<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Прототипы приложений</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#0c1524;--muted:#6a7689;--accent:#1b43d8;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#070a10;--card:#121823;--ink:#e9edf5;--muted:#8d97a8;--accent:#7f9bff}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:48px 16px}
h1{font-size:24px;margin:0 0 24px}
a{display:block;background:var(--card);color:inherit;text-decoration:none;border-radius:16px;padding:18px 20px;margin-bottom:12px}
a b{display:block;color:var(--accent)}
a span{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Прототипы приложений клиник</h1>
<a href="surgeon/"><b>Пластическая хирургия</b><span>Путь пациента: консультация, обследование, операция</span></a>
<a href="dentist/"><b>Стоматология</b><span>План лечения, визиты и карта зубов</span></a>
</main>
</body>
</html>
